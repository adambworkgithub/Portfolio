<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Contact</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="stylescontact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>

    <div class="page" id="contact">
        <div class="container">
            <div class="contact-section">
                <div class="contact-info">
                    <h2>Get in Touch</h2>
                    <div class="contact-item linkedin">
                        <i class="fab fa-linkedin"></i>
                        <a href="https://www.linkedin.com/in/adam-bagnall" target="_blank">linkedin.com/in/adam-bagnall</a>
                    </div>
                    <div class="contact-item email">
                        <i class="fas fa-envelope"></i>
                        <a href="mailto:adambagnall@gmail.com">adambagnall@gmail.com</a>
                    </div>
                    <div class="contact-item phone">
                        <i class="fas fa-phone"></i>
                        <a href="tel:5551234567">(555) 123-4567</a>
                    </div>
                </div>

                <div class="contact-form-section">
                    <h2>Contact Me</h2>
                    <div class="contact-form">
                        <input type="text" placeholder="Name">
                        <input type="email" placeholder="Email">
                        <textarea rows="5" placeholder="Message"></textarea>
                        <button>Send Message</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
