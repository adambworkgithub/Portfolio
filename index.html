<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            line-height: 1.6;
        }

        nav {
            background: #333;
            padding: 1rem;
            position: fixed;
            width: 100%;
            top: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 1rem;
            padding: 0.5rem;
        }

        nav a:hover {
            background: #555;
            border-radius: 4px;
        }

        .page {
            display: none;
            padding: 6rem 2rem 2rem;
            min-height: 100vh;
        }

        .page.active {
            display: block;
        }

        #home {
            background: #f4f4f4;
        }

        #about {
            background: #e8e8e8;
        }

        #projects {
            background: #f4f4f4;
        }

        #contact {
            background: #e8e8e8;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 1rem;
        }

        .project-card {
            background: white;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 500px;
        }

        input, textarea {
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            background: #333;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        @media (max-width: 600px) {
            nav {
                text-align: center;
            }
            
            nav a {
                display: inline-block;
                margin: 0.25rem;
            }

            .page {
                padding: 8rem 1rem 2rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="#" onclick="showPage('home')">Home</a>
        <a href="#" onclick="showPage('about')">About</a>
        <a href="#" onclick="showPage('projects')">Projects</a>
        <a href="#" onclick="showPage('contact')">Contact</a>
    </nav>

    <div id="home" class="page active">
        <div class="container">
            <h1>Welcome to My Portfolio</h1>
            <p>Hi, I'm [Your Name]. I'm a [Your Profession] based in [Your Location].</p>
        </div>
    </div>

    <div id="about" class="page">
        <div class="container">
            <h1>About Me</h1>
            <p>I have X years of experience in...</p>
            <p>My skills include...</p>
        </div>
    </div>

    <div id="projects" class="page">
        <div class="container">
            <h1>My Projects</h1>
            <div class="project-card">
                <h3>Project 1</h3>
                <p>Description of project 1...</p>
            </div>
            <div class="project-card">
                <h3>Project 2</h3>
                <p>Description of project 2...</p>
            </div>
        </div>
    </div>

    <div id="contact" class="page">
        <div class="container">
            <h1>Contact Me</h1>
            <form class="contact-form">
                <input type="text" placeholder="Name" required>
                <input type="email" placeholder="Email" required>
                <textarea placeholder="Message" rows="5" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </div>

    <script>
        function showPage(pageId) {
            // Hide all pages
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            
            // Show selected page
            document.getElementById(pageId).classList.add('active');
        }
    </script>
</body>
</html>
